name: Web Release Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_DUMMY_PASSWORD: ${{ secrets.E2E_DUMMY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (errors only)
        run: npm run lint:errors

      - name: UI tests
        run: npm run test:ui -- --runInBand

      - name: Encoding check
        run: npm run check:encoding

      - name: Web export build
        run: npx expo export --platform web --output-dir web-build

      - name: Check E2E secrets
        id: e2e_secrets
        run: |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] && [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] && [ -n "$E2E_DUMMY_PASSWORD" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "Skipping E2E smoke because required secrets are missing."
          fi

      - name: E2E smoke (web)
        if: steps.e2e_secrets.outputs.ready == 'true'
        run: npm run test:e2e:web
